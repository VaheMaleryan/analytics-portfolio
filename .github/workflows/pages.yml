name: Verify and publish portfolio
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: ./start.sh --check
      - uses: actions/configure-pages@v5
      - name: Prepare static files
        run: |
          mkdir _public
          cp index.html style.css app.js _public/
          cp -r assets content _public/
          touch _public/.nojekyll
      - uses: actions/upload-pages-artifact@v3
        with: {path: _public}
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
